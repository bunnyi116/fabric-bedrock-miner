name: release

# release: <默认> (发布标题)
# dispatch (全部): 手动发布 $target_release_tag
run-name: |-
  ${{ github.event_name == 'workflow_dispatch' && format('手动发布 {0}', inputs.target_release_tag) || '' }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: 要附加构件到的发布的标签
        type: string
        required: true

jobs:
  # 显示操作参数
  show_action_parameters:
    runs-on: ubuntu-latest
    steps:
      - name: 显示操作参数
        run: |
          cat <<EOF > $GITHUB_STEP_SUMMARY
          ## 操作参数
          - target_release_tag: \`${{ github.event.inputs.target_release_tag }}\`
          EOF

  # 确保输入的发布标签有效
  validate_release:
    runs-on: ubuntu-latest
    steps:
      - name: 获取 GitHub 发布信息
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event.inputs.target_release_tag }}

  # 构建
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    needs:
      - validate_release
    with:
      release: true

  # 发布
  release:
    needs:
      - build
    runs-on: ubuntu-latest

    # 允许 mod 发布步骤向发布添加资源
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 显示上下文信息
        run: |
          echo ref_name = ${{ github.ref_name }}
          echo target_release_tag = ${{ github.event.inputs.target_release_tag }}

      - name: 下载 fabricWrapper 构件
        uses: actions/download-artifact@v4
        with:
          name: fabric-wrapper-jar
          path: fabric-wrapper-jar

      - name: 获取 GitHub 发布信息
        id: get_release
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event.inputs.target_release_tag }}

      - name: 生成发布相关信息
        id: release_info
        run: |
          if [ $GITHUB_EVENT_NAME == 'release' ]
          then
              # 留空值，以便 Kir-Antipov/mc-publish 从操作上下文中推断标签
              echo "tag_name=" >> $GITHUB_OUTPUT
          elif [ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]
          then
              echo "tag_name=${{ github.event.inputs.target_release_tag }}" >> $GITHUB_OUTPUT
          else
              echo 未知的 GitHub 事件名称 $GITHUB_EVENT_NAME
              exit 1
          fi

      - name: 读取通用属性
        id: properties_g
        uses: BrycensRanch/read-properties-action@v1
        with:
          file: gradle.properties
          all: true

      - name: 准备 fabricWrapper 文件信息
        id: file_info
        run: |
          shopt -s extglob
          FILE_PATHS=$(ls fabric-wrapper-jar/!(*-@(dev|sources|shadow)).jar)
          if (( ${#FILE_PATHS[@]} != 1 )); then
              echo "错误: 找到 ${#FILE_PATHS[@]} 个 fabricWrapper 文件，预期只有 1 个"
              ls -la fabric-wrapper-jar/
              exit 1
          else
              FILE_PATH=${FILE_PATHS[0]}
          fi
          
          FILE_NAME=$(basename $FILE_PATH)
          FILE_HASH=$(sha256sum $FILE_PATH | awk '{ print $1 }')
          echo "path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "hash=$FILE_HASH" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: 获取支持的 Minecraft 版本
        id: versions
        run: |
          # 从 settings.json 获取所有支持的版本
          if [ -f "settings.json" ]; then
            VERSIONS=$(jq -r '.versions | join(",")' settings.json)
            echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
            echo "成功获取版本: $VERSIONS"
          else
            echo "错误: 找不到 settings.json 文件"
            exit 1
          fi

      - name: 准备更新日志
        uses: actions/github-script@v7
        id: changelog
        with:
          script: return process.env.CHANGELOG
          result-encoding: string
        env:
          CHANGELOG: |-
            ${{ steps.get_release.outputs.body }}
            
            -------
            
            构建信息
            
            - 文件名称: `${{ steps.file_info.outputs.name }}`
            - SHA-256: `${{ steps.file_info.outputs.hash }}`
            - 构建来源: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 支持的 Minecraft 版本: ${{ steps.versions.outputs.versions }}

      - name: 发布 Minecraft Mods
        uses: Kira-NT/mc-publish@v3.3
        with:
          # https://modrinth.com/settings/pats
          modrinth-id: G4udXdNu
          modrinth-token: ${{ secrets.MODRINTH_API_TOKEN }}

          # https://legacy.curseforge.com/account/api-tokens
          # curseforge-id: 314159
          # curseforge-token: ${{ secrets.CF_API_TOKEN }}

          github-tag: ${{ steps.release_info.outputs.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: ${{ steps.file_info.outputs.path }}

          name: ${{ format('{0} v{1} 版本包', steps.properties_g.outputs.mod_name, steps.properties_g.outputs.mod_version) }}
          version: ${{ format('v{0}-versionpack', steps.properties_g.outputs.mod_version) }}
          version-type: release

          loaders: fabric
          game-versions: ${{ steps.versions.outputs.versions }}
          game-version-filter: any
          dependencies: ''  # 显式声明依赖关系，这样 mc-publish 就不会尝试从 fabric.mod.json 加载

          github-changelog: ${{ steps.get_release.outputs.body }}
          modrinth-changelog: ${{ steps.changelog.outputs.result }}
          curseforge-changelog: ${{ steps.changelog.outputs.result }}

          retry-attempts: 3
          retry-delay: 10000