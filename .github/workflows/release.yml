name: 发布

# release: <默认>（发布标题）
# dispatch（全部）: 手动发布 $target_release_tag
# dispatch（指定）: 手动发布 $target_release_tag（子项目: $target_subproject）
run-name: |-
  ${{ github.event_name == 'workflow_dispatch' && format('手动发布 {0}{1}', inputs.target_release_tag, inputs.target_subproject && format('（子项目: {0}）', inputs.target_subproject) || '') || '' }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target_subproject:
        description: |-
          要发布的指定 Minecraft 版本的子项目名称，用 "," 分隔
          默认将发布全部子项目
        type: string
        required: false
        default: ''
      target_release_tag:
        description: 要附加构建产物的发布标签
        type: string
        required: true


jobs:
  show_action_parameters:
    runs-on: ubuntu-latest
    steps:
      - name: 显示操作参数
        run: |
          cat <<EOF > $GITHUB_STEP_SUMMARY
          ## 操作参数
          - target_subproject: \`${{ github.event.inputs.target_subproject }}\`
          - target_release_tag: \`${{ github.event.inputs.target_release_tag }}\`
          EOF

  matrix_prep:
    uses: ./.github/workflows/matrix_prep.yml
    with:
      target_subproject: ${{ github.event.inputs.target_subproject }}

  # 确保输入的发布标签有效
  validate_release:
    runs-on: ubuntu-latest
    steps:
      - name: 获取 GitHub 发布信息
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event.inputs.target_release_tag }}

  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    needs:
      - validate_release
    with:
      target_subproject: ${{ github.event.inputs.target_subproject }}
      release: true

  release:
    needs:
      - matrix_prep
      - build
    runs-on: ubuntu-latest

    # 允许模组发布步骤向发布添加资产
    # https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
    permissions:
      contents: write

    strategy:
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: 显示上下文
        run: |
          echo ref_name = ${{ github.ref_name }}
          echo target_subproject = ${{ github.event.inputs.target_subproject }}
          echo target_release_tag = ${{ github.event.inputs.target_release_tag }}

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts

      - name: 获取 GitHub 发布信息
        id: get_release
        uses: cardinalby/git-get-release-action@1.2.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.event.inputs.target_release_tag }}

      - name: 生成发布相关信息
        id: release_info
        run: |
          if [ $GITHUB_EVENT_NAME == 'release' ]
          then
              # 此处留空，使 mc-publish 从 Action 上下文推断标签
              echo "tag_name=" >> $GITHUB_OUTPUT
          elif [ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]
          then
              echo "tag_name=${{ github.event.inputs.target_release_tag }}" >> $GITHUB_OUTPUT
          else
              echo 未知的 GitHub 事件名称 $GITHUB_EVENT_NAME
              exit 1
          fi

      - name: 读取通用属性
        id: properties_g
        uses: BrycensRanch/read-properties-action@v1
        with:
          file: gradle.properties
          all: true

      - name: 读取版本专属属性
        id: properties_v
        uses: BrycensRanch/read-properties-action@v1
        with:
          file: ${{ format('versions/{0}/gradle.properties', matrix.subproject) }}
          all: true

      - name: 准备文件信息
        id: file_info
        run: |
          shopt -s extglob
          FILE_PATHS=$(ls ${{ format('build-artifacts/{0}/build/libs/!(*-@(dev|sources|shadow)).jar', matrix.subproject) }})
          if (( ${#FILE_PATHS[@]} != 1 )); then
              echo "错误: 发现 ${#FILE_PATHS[@]} 个文件，期望恰好 1 个"
              exit 1
          else
              FILE_PATH=${FILE_PATHS[0]}
          fi
          
          FILE_NAME=$(basename $FILE_PATH)
          FILE_HASH=$(sha256sum $FILE_PATH | awk '{ print $1 }')
          echo "path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "hash=$FILE_HASH" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: 准备更新日志
        uses: actions/github-script@v7
        id: changelog
        with:
          script: return process.env.CHANGELOG
          result-encoding: string
        env:
          CHANGELOG: |-
            ${{ steps.get_release.outputs.body }}
            
            -------
            
            构建信息
            
            - 文件名: `${{ steps.file_info.outputs.name }}`
            - SHA-256: `${{ steps.file_info.outputs.hash }}`
            - 构建来源: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: 发布 Minecraft 模组
        uses: Kira-NT/mc-publish@v3.3
        with:
          # https://modrinth.com/settings/pats
          modrinth-id: G4udXdNu
          modrinth-token: ${{ secrets.MODRINTH_API_TOKEN }}

          # https://legacy.curseforge.com/account/api-tokens
#          curseforge-id: 314159
#          curseforge-token: ${{ secrets.CF_API_TOKEN }}

          github-tag: ${{ steps.release_info.outputs.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: ${{ steps.file_info.outputs.path }}

          name: ${{ format('{0} v{1} for mc{2}', steps.properties_g.outputs.mod_name, steps.properties_g.outputs.mod_version, steps.properties_v.outputs.minecraft_version) }}
          version: ${{ format('v{1}-mc{0}', steps.properties_v.outputs.minecraft_version, steps.properties_g.outputs.mod_version) }}
          version-type: release

          loaders: fabric
          game-versions: ${{ steps.properties_v.outputs.game_versions }}
          game-version-filter: any
          dependencies: ''  # 显式声明依赖，避免 mc-publish 尝试从 fabric.mod.json 加载

          github-changelog: ${{ steps.get_release.outputs.body }}
          modrinth-changelog: ${{ steps.changelog.outputs.result }}
          curseforge-changelog: ${{ steps.changelog.outputs.result }}

          retry-attempts: 3
          retry-delay: 10000
