name: _step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 对于非主分支/主分支/开发分支，缓存设为只读
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      - name: 使用 Gradle 构建
        run: |
          chmod +x gradlew
          # 只构建 fabricWrapper，它会自动处理所有版本
          ./gradlew :fabricWrapper:build
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}

      - name: 收集 fabricWrapper 版本包
        run: |
          shopt -s extglob
          mkdir -p fabric-wrapper-jar
          # 只收集 fabricWrapper 的 JAR 文件（用于发布）
          for jar in fabricWrapper/build/libs/!(*-@(dev|sources|shadow)).jar; do
              cp -p "$jar" fabric-wrapper-jar/
          done
          echo "fabricWrapper 版本包:"
          ls -l fabric-wrapper-jar

      - name: 上传 fabricWrapper 版本包（发布用）
        uses: actions/upload-artifact@v4
        with:
          name: fabric-wrapper-jar
          path: fabric-wrapper-jar/*.jar

  summary:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: fabric-wrapper-jar
          path: build-artifacts/fabricWrapper/build/libs

      - name: 生成构建摘要
        run: |
          pip install jproperties
          python .github/workflows/scripts/summary.py