name: _step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false
      target_subproject:
        description: 参见 release.yml，留空构建全部
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        required: false
        default: false
        description: "是否构建发布版本（默认: false）"
      target_subproject:
        description: "参见 release.yml，留空构建全部"
        type: string
        required: false
        default: ''
#      # [特性] MIXIN_AUDITOR
#      mixin_audit:
#        description: 构建后运行 Mixin 审计
#        type: boolean
#        required: false
#        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: 安装 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/wrapper
            ./.gradle/loom-cache
            ./libs
          key: ${{ runner.os }}-gradle-common
          restore-keys: |
            ${{ runner.os }}-gradle-common

      - name: 使用 Gradle 构建
        run: |
          chmod +x gradlew
          if [ -z "${{ inputs.target_subproject }}" ]; then
              echo "构建所有子项目"
              ./gradlew build --stacktrace
          else
              args=$(echo "${{ inputs.target_subproject }}" | tr ',' '\n' | sed 's/$/:build/' | paste -sd ' ')
              echo "构建参数=$args"
              ./gradlew $args --stacktrace
          fi
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}

      #      # [特性] MIXIN_AUDITOR
      #      - name: 运行 Minecraft 客户端 Mixin 审计
      #        if: ${{ inputs.mixin_audit }}
      #        timeout-minutes: 10
      #        run: |
      #          mkdir -p ./run
      #          echo eula=true > ./run/eula.txt  # 服务端需要此文件
      #          ./gradlew runClientMixinAudit

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: versions/*/build/libs/

      - name: 收集模组 jar
        run: |
          shopt -s extglob
          mkdir mod-jars
          for jar in versions/*/build/libs/!(*-@(dev|sources|shadow)).jar; do
              cp -p "$jar" mod-jars/
          done
          ls -l mod-jars

      # 这是推荐用户下载的构建产物
      - name: 上传模组 jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: mod-jars/*.jar

  #      # [特性] FALLENS_MAVEN
  #      - name: 使用 Gradle 发布
  #        if: inputs.release || github.ref == 'refs/heads/dev'
  #        run: |
  #          if [ -z "${{ inputs.target_subproject }}" ]; then
  #              echo "发布所有子项目"
  #              ./gradlew publish
  #          else
  #              args=$(echo "${{ inputs.target_subproject }}" | tr ',' '\n' | sed 's/$/:publish/' | paste -sd ' ')
  #              echo "发布参数=$args"
  #              ./gradlew $args
  #          fi
  #        env:
  #          BUILD_ID: ${{ github.run_number }}
  #          BUILD_RELEASE: ${{ inputs.release }}
  #          FALLENS_MAVEN_TOKEN: ${{ secrets.FALLENS_MAVEN_TOKEN }}

  summary:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts

      - name: 生成构建摘要
        run: |
          python .github/workflows/scripts/summary.py
        env:
          TARGET_SUBPROJECT: ${{ inputs.target_subproject }}
